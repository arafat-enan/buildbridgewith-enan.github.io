w.vy+=G*DT;w.y+=w.vy*DT;if(s&&w.y>s.y-r){w.y=s.y-r;w.vy=0}}
function phys(){const g=Math.min(1,tt/.8),gs=g*g*(3-2*g);

for(const b of B){if(b.dead)continue;const A=b.a,C=b.b,M=MAT[b.m];let dx=C.x-A.x,dy=C.y-A.y;const l=Math.hypot(dx,dy)||1e-6;dx/=l;dy/=l;const k=M.ea/b.L0;let Fe=k*(l-b.L0);if(b.m=='cable'&&Fe<0)Fe=0;b.s=Math.abs(Fe)/(M.f*STR);if(b.s>1){snapB(b);continue}

function guide(gt){const n=Math.ceil(lv.gap/100),dx=lv.gap/n,L=[],m1=lv.w==0?'wood':'steel',ty=gt==null?lv.i%6:gt,D=[],pt=ty==1||ty==4,bow=ty==3||ty==4,ar=ty==2||ty==5,war=ty==0||ty==3||ty==5;for(let i=0;i<=n;i++)D.push({x:xl+dx*i,y:HY+lv.sl*i/n});for(let i=0;i<n;i++)L.push([D[i],D[i+1],'road']);if(lv.v.includes('walker'))for(let i=0;i<n;i++)L.push([D[i],D[i+1],'tile']);const h=f=>bow?50+70*Math.sin(Math.PI*f/n):80;

function mkHint(to){const wh=x=>{const f=(x-xl)/lv.gap;return f<.34?'left side':f<.67?'middle':'right side'};const f=firstSnap;
